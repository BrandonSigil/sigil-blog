# Once a day: refresh the release calendar from Wikipedia and the news feeds
# (scripts/fetch-releases.mjs), then draft or refresh next month's "hot releases" post from the
# 25th on (scripts/draft-hot-releases.mjs; drafts never show on the site). Commits only when
# something changed; the push to main makes Vercel rebuild the site.
name: Fetch releases

on:
  schedule:
    - cron: '30 14 * * *' # 14:30 UTC, every day
  workflow_dispatch: {} # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: site-data # shared with news.yml, so the two never push at once
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-releases.mjs
      - run: node scripts/draft-hot-releases.mjs
      - name: Commit if changed
        run: |
          git add src/data/calendar-wiki.json src/data/calendar-press.json src/content/blog/hot-releases-*.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "sigil-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update release calendar"
          git pull --rebase
          git push
